# Free Supabase projects pause after 7 days without activity, which would stop logins and contests
# on the real site. Once a day this asks the API for the contest list, which reads the database.
name: keep-alive

on:
  schedule:
    - cron: "0 18 * * *" # every day at 03:00 Japan time
  workflow_dispatch: # can also be started by hand (Actions → keep-alive → Run workflow)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read from the production database through the API
        run: curl -fsS --max-time 120 https://ear-training-api.onrender.com/api/competitions > /dev/null && echo "database reached"
