# Free Supabase projects pause after 7 days without activity, which would stop logins and contests
# on the real site. Every 3 hours this:
#   ping:     asks the API for the contest list, which reads the production database
#   watchdog: restores any paused project (scripts/supabase_watchdog.py)
name: keep-alive

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: # can also be started by hand (Actions → keep-alive → Run workflow)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read from the production database through the API
        run: curl -fsS --max-time 120 https://ear-training-api.onrender.com/api/competitions > /dev/null && echo "database reached"

  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore paused Supabase projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REFS: vnaiernisqutovohyirg # production
        run: python3 scripts/supabase_watchdog.py
