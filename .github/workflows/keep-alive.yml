# Free Supabase projects pause after 7 days without activity, which would stop logins and contests
# on the real site. Every 3 hours this:
#   ping:     asks the API for the contest list, which reads the production database;
#             if the API is stuck, restarts it on Render (same deploy hook as tests.yml)
#   watchdog: restores any paused project (scripts/supabase_watchdog.py)
#   dev-ping: keeps the development project awake (the watchdog's token can't access it)
name: keep-alive

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: # can also be started by hand (Actions → keep-alive → Run workflow)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Never fails the run (no email): a restart is the fix, and it happens here automatically.
      - name: Read from the production database through the API, restart the API if it is stuck
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://ear-training-api.onrender.com/api/competitions > /dev/null; then
              echo "database reached"
              exit 0
            fi
            sleep 20
          done
          echo "The API did not answer 3 times: asking Render to restart it"
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" > /dev/null && echo "restart requested" || echo "the restart request failed"
          fi

  dev-ping:
    runs-on: ubuntu-latest
    steps:
      # A login attempt with a made-up account makes the project look in its database. The expected answer
      # is "wrong password". The key is the public one, the same kind every website visitor receives.
      # Never fails the run: nothing here can fix a paused project, so there's nothing to report.
      - name: Make the development project read its database
        env:
          KEY: sb_publishable_gkkmbyHeN6XVsEFaW6eVUw_ttlSaNgB
        run: |
          curl -sS --max-time 60 -o /dev/null -w "HTTP %{http_code}" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"email":"keep-alive@example.com","password":"not-a-real-password"}' "https://kskkgkzqjxkfmmunifhr.supabase.co/auth/v1/token?grant_type=password" || echo "not reachable"

  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore paused Supabase projects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REFS: vnaiernisqutovohyirg # production (the token gets HTTP 403 on the development project)
        run: python3 scripts/supabase_watchdog.py
