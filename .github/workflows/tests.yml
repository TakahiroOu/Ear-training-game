# Runs all tests on GitHub for every push and pull request.
# A red ✗ on GitHub means something is broken: fix it before it goes online.
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres: # throwaway database for the tests, like db-test in docker-compose.yml
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/test
      SOUNDS_DIR: ${{ github.workspace }}/sounds
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx oxlint
      - run: npm run build

  deploy:
    # After every test has passed on main, tell Render to put the new version online.
    # The deploy hook addresses are secret: they're stored in GitHub (Settings → Secrets and variables → Actions).
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the website
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEBSITE }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_WEBSITE is not set yet: skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render is deploying the website"
      - name: Deploy the API
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_API is not set yet: skipping"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Render is deploying the API"
