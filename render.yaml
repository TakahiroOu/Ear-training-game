# Render "Blueprint": describes the two online services so Render can create them in one go
# (Render dashboard → New → Blueprint → choose this GitHub repository).
# Values marked `sync: false` are secrets/addresses you type into Render's dashboard;
# they are never stored in this file or on GitHub.
services:
  # The Python API (FastAPI). Free plan: sleeps after 15 minutes without visitors.
  - type: web
    name: ear-training-api
    runtime: docker
    plan: free
    region: singapore # the closest Render region to Japan
    branch: main
    autoDeployTrigger: "off" # deploys are started by GitHub Actions after the tests pass (.github/workflows/tests.yml)
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile.prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL # Supabase (production project) → Connect → Session pooler, with postgresql+psycopg://
        sync: false
      - key: SUPABASE_URL # https://<production project id>.supabase.co
        sync: false
      - key: FRONTEND_ORIGINS # the website's address, e.g. https://chouon-training.com,https://ear-training-xlhd.onrender.com
        sync: false

  # The website (React, built into plain files). Static sites are free and never sleep.
  - type: web
    name: ear-training
    runtime: static
    branch: main
    autoDeployTrigger: "off" # deploys are started by GitHub Actions after the tests pass (.github/workflows/tests.yml)
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL # the API's address, e.g. https://ear-training-api.onrender.com
        sync: false
      - key: VITE_SUPABASE_URL # same as SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY # production project's publishable key (sb_publishable_...)
        sync: false
